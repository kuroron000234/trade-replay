name: Release
# v で始まるタグを push すると、Windows 版をビルドしてリリースに載せる
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
      - name: ビルド
        run: desktop/build.sh "${GITHUB_REF_NAME#v}"
      - name: リリース
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Trade Replay $GITHUB_REF_NAME" --notes-file desktop/RELEASE_NOTES.md
          gh release upload "$GITHUB_REF_NAME" dist/TradeReplay-*-windows-x64.zip --clobber
